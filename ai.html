<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Art - Akahoshi's Arts</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <main class="ai-page">


        <h1 class="gallery-title">
            AI
        </h1>



        <div class="ai-toolbar">

            
            <button class="request-button">

                <img
                    src="Assets/Buttons/message.png"
                    alt°"Request"

            </button>


            <div class="search-box">


                <input
                    type="search"
                    id="tagSearch"
                    placeholder="Search..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false">



                <img
                    src="Assets/Buttons/search.png"
                    class="search-icon"
                    alt="search">


                <!-- SUGERENCIAS DEL BUSCADOR -->

                <div class="tag-suggestions">

                </div>



            </div>



        </div>





        <!-- TAGS SELECCIONADOS -->

        <div id="selectedTags">

        </div>





        <!-- GALERÍA CARGADA POR ai.js -->

        <div class="ai-gallery">

        </div>





    </main>





    <script src="ai.js"></script>


</body>


</html>
