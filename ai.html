<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Art - Akahoshi's Arts</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <main class="ai-page">

        <h1 class="gallery-title">
            AI
        </h1>


        <div class="ai-toolbar">


            <div class="search-box">

                <input
                    type="text"
                    id="tagSearch"
                    placeholder="Search tags...">

                <span class="search-icon">
                    🔍
                </span>

            </div>


            <button class="request-button">

                <img
                    src="Assets/Buttons/message.png"
                    alt="Request">

            </button>


        </div>


        <div id="selectedTags">
            
        </div>


        <div class="gallery-grid">

            <!-- Las imágenes serán cargadas por ai.js -->

        </div>


    </main>


    <script src="ai.js"></script>

</body>

</html>
