<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Art - Akahoshi's Arts</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <main class="ai-page">
        
<div class="top-bar">

    <a href="index.html" class="home-button">

        <img
            src="Assets/Buttons/home.png"
            alt="Home">

    </a>

    <a href="https://form.jotform.com/261878967182072" class="request-button" target="_blank">

        <img
            src="Assets/Buttons/message.png"
            alt="Request">

    </a>

</div>
        
        <h1 class="gallery-title">

            <img
                src="Assets/Logo/ai-logo.png
                alt="AI">
        </h1>

<div class="ai-toolbar">

    <div class="search-box">

        <input
            type="search"
            id="tagSearch"
            placeholder="Search..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false">

        <img
            src="Assets/Buttons/search.png"
            class="search-icon"
            alt="Search">

        <div class="tag-suggestions"></div>

    </div>

</div>




        <!-- TAGS SELECCIONADOS -->

        <div id="selectedTags">

        </div>





        <!-- GALERÍA CARGADA POR ai.js -->

        <div class="ai-gallery">

        </div>





    </main>





    <script src="ai.js"></script>


</body>


</html>
