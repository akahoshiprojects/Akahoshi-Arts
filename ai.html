<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Art - Akahoshi's Arts</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <main class="ai-page">


        <h1 class="gallery-title">
            AI
        </h1>



        <div class="ai-toolbar">


            <div class="search-box">


                <input
                    type="text"
                    id="tagSearch"
                    placeholder="Search tags...">



                <span class="search-icon">
                    🔍
                </span>


            </div>



            <button class="request-button">


                <img
                    src="Assets/Buttons/message.png"
                    alt="Request">


            </button>


        </div>



        <!-- Aquí aparecerán las sugerencias -->

        <div class="tag-suggestions">

        </div>



        <!-- Aquí aparecerán los tags seleccionados -->

        <div id="selectedTags">

        </div>



        <!-- Galería cargada por ai.js -->

        <div class="ai-gallery">

        </div>



    </main>



    <script src="ai.js"></script>


</body>


</html>
